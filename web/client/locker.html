<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="shell-type" content="mobile_tab">

    <title>Mở Tủ Bỏ Hàng | EXPRESS</title>

    <!-- Google Fonts: Be Vietnam Pro -->
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Google Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap"
        rel="stylesheet"
    >

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration & Main JS -->
    <script src="assets/js/main.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        @keyframes pulseRing {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1.03);
                box-shadow: 0 0 0 16px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .locker-active-pulse {
            animation: pulseRing 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
    </style>
</head>

<body class="bg-background font-body-md text-on-surface antialiased flex flex-col min-h-screen">

    <main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-background min-h-screen">

        <!-- Thanh trên cùng với nút Hủy giao dịch bên tay trái -->
        <div class="w-full max-w-md mx-auto px-margin pt-4 pb-2 flex items-center justify-between">
            <button
                type="button"
                id="btn-cancel-transaction"
                class="inline-flex items-center gap-1.5 px-3.5 py-2
                rounded-xl bg-error-container/70 hover:bg-error-container
                text-on-error-container font-label-md text-label-md font-semibold
                transition-all active:scale-95 shadow-sm"
            >
                <span class="material-symbols-outlined text-[18px]">close</span>
                <span>Hủy giao dịch</span>
            </button>

            <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant">
                Bước 3 / 3
            </span>
        </div>

        <!-- Khung nội dung chính -->
        <div class="flex-1 flex flex-col justify-center px-margin py-3 gap-4 max-w-md mx-auto w-full">

            <!-- Card hiển thị trạng thái Mở Tủ -->
            <div id="locker-status-card" class="bg-surface-container/60 border border-outline-variant/40 rounded-3xl p-5 text-center shadow-lg space-y-4">
                
                <!-- Icon trạng thái động -->
                <div class="flex justify-center pt-2">
                    <div id="locker-icon-wrap" class="w-24 h-24 rounded-full bg-emerald-500/15 border-2 border-emerald-500 flex items-center justify-center text-emerald-600 locker-active-pulse">
                        <span id="locker-status-icon" class="material-symbols-outlined text-[52px]">
                            lock_open
                        </span>
                    </div>
                </div>

                <!-- Tiêu đề và trạng thái ô tủ -->
                <div>
                    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 font-bold text-xs uppercase tracking-wider mb-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                        <span id="locker-badge">Ô TỦ ĐANG ĐƯỢC MỞ</span>
                    </div>
                    <h1 id="locker-main-title" class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold tracking-tight">
                        Vui Lòng Bỏ Hàng Vào Tủ
                    </h1>
                    <p id="locker-sub-desc" class="font-body-sm text-on-surface-variant mt-1.5">
                        Cửa ngăn tủ số <strong id="assigned-locker-id" class="text-secondary-container text-lg font-bold">...</strong> đã mở tự động. Hãy đặt kiện hàng vào bên trong và ấn nút bên dưới.
                    </p>
                </div>

                <!-- Mô phỏng 6 ngăn tủ Smart Locker (1 -> 6) trực quan -->
                <div class="pt-2">
                    <div class="text-xs font-semibold text-on-surface-variant mb-2 text-left flex items-center justify-between">
                        <span>Sơ đồ tủ thông minh:</span>
                        <span class="text-emerald-600 font-bold text-[11px] flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Ngăn mở
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-2.5">
                        <div id="grid-tu-1" class="p-3 rounded-xl border border-outline-variant/50 bg-surface text-center font-bold text-sm text-on-surface-variant">Tủ 1</div>
                        <div id="grid-tu-2" class="p-3 rounded-xl border border-outline-variant/50 bg-surface text-center font-bold text-sm text-on-surface-variant">Tủ 2</div>
                        <div id="grid-tu-3" class="p-3 rounded-xl border border-outline-variant/50 bg-surface text-center font-bold text-sm text-on-surface-variant">Tủ 3</div>
                        <div id="grid-tu-4" class="p-3 rounded-xl border border-outline-variant/50 bg-surface text-center font-bold text-sm text-on-surface-variant">Tủ 4</div>
                        <div id="grid-tu-5" class="p-3 rounded-xl border border-outline-variant/50 bg-surface text-center font-bold text-sm text-on-surface-variant">Tủ 5</div>
                        <div id="grid-tu-6" class="p-3 rounded-xl border border-outline-variant/50 bg-surface text-center font-bold text-sm text-on-surface-variant">Tủ 6</div>
                    </div>
                </div>

            </div>

            <!-- Card Tóm tắt thông tin đơn hàng -->
            <div class="bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-4 space-y-2 text-body-sm shadow-sm">
                <div class="flex items-center justify-between border-b border-outline-variant/30 pb-2">
                    <span class="text-on-surface-variant">Mã vận đơn:</span>
                    <span id="order-code-display" class="font-mono font-bold text-primary text-base">Đang tạo...</span>
                </div>
                <div class="grid grid-cols-3 gap-1">
                    <span class="text-on-surface-variant">Người gửi:</span>
                    <span id="sender-display" class="col-span-2 font-medium text-primary">...</span>
                </div>
                <div class="grid grid-cols-3 gap-1">
                    <span class="text-on-surface-variant">Người nhận:</span>
                    <span id="receiver-display" class="col-span-2 font-medium text-primary">...</span>
                </div>
            </div>

            <!-- Nút bấm ĐÓNG TỦ khi đã bỏ hàng -->
            <div class="pt-1">
                <button
                    type="button"
                    id="btn-close-locker"
                    class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white font-bold text-label-lg shadow-lg shadow-emerald-600/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2.5"
                >
                    <span class="material-symbols-outlined text-[24px]">door_front</span>
                    <span id="btn-close-text">ĐÃ BỎ HÀNG &amp; ĐÓNG TỦ</span>
                </button>
            </div>

        </div>

    </main>

    <!-- Script điều khiển mở/đóng tủ -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const assignedLockerEl = document.getElementById("assigned-locker-id");
            const orderCodeEl = document.getElementById("order-code-display");
            const senderEl = document.getElementById("sender-display");
            const receiverEl = document.getElementById("receiver-display");
            const btnClose = document.getElementById("btn-close-locker");
            const btnCloseText = document.getElementById("btn-close-text");
            const lockerIconWrap = document.getElementById("locker-icon-wrap");
            const lockerStatusIcon = document.getElementById("locker-status-icon");
            const lockerBadge = document.getElementById("locker-badge");
            const lockerSubDesc = document.getElementById("locker-sub-desc");

            let currentLockerId = null;
            let currentOrderCode = null;

            // 1. Lấy thông tin đơn hàng tạm đã lưu trên server để hiển thị
            async function loadPendingOrderInfo() {
                try {
                    const response = await fetch("/api/orders/pending");
                    const data = await response.json();
                    if (data && data.success && data.pendingOrder) {
                        senderEl.textContent = `${data.pendingOrder.senderName} (${data.pendingOrder.senderPhone})`;
                        receiverEl.textContent = `${data.pendingOrder.receiverName} (${data.pendingOrder.receiverPhone})`;
                    }
                } catch (e) {
                    console.error("Lỗi lấy thông tin đơn hàng từ máy chủ:", e);
                }
            }

            // Gọi tải thông tin hiển thị trước
            loadPendingOrderInfo();

            // 2. Gọi API tạo đơn hàng và cấp ngăn tủ trống (server tự động lấy thông tin pending đã lưu)
            async function initLockerDeposit() {
                try {
                    const response = await fetch("/api/orders/create", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" }
                    });

                    const data = await response.json();

                    if (data.success && data.order) {
                        currentLockerId = data.order.lockerId;
                        currentOrderCode = data.order.orderCode;

                        assignedLockerEl.textContent = currentLockerId;
                        orderCodeEl.textContent = currentOrderCode;

                        // Cập nhật thông tin người gửi/nhận chính xác từ server
                        if (data.order.senderName && data.order.senderPhone) {
                            senderEl.textContent = `${data.order.senderName} (${data.order.senderPhone})`;
                        }
                        if (data.order.receiverName && data.order.receiverPhone) {
                            receiverEl.textContent = `${data.order.receiverName} (${data.order.receiverPhone})`;
                        }

                        // Cập nhật giao diện sơ đồ tủ
                        highlightLocker(currentLockerId);
                    } else {
                        throw new Error(data.message || "Không thể cấp ngăn tủ");
                    }
                } catch (error) {
                    console.error("Lỗi cấp tủ:", error);
                    AppPopup.show({
                        title: "Không Thể Mở Tủ",
                        icon: "error",
                        content: `
                            <p class="text-on-surface-variant">
                                ${error.message || "Đã xảy ra lỗi khi cấp ngăn tủ trống. Vui lòng thử lại sau."}
                            </p>
                        `,
                        confirmText: "Về trang chủ",
                        onConfirm: () => {
                            window.location.href = "/";
                        }
                    });
                }
            }

            // Đánh dấu ô tủ được chọn trên sơ đồ trực quan
            function highlightLocker(id) {
                for (let i = 1; i <= 6; i++) {
                    const el = document.getElementById(`grid-tu-${i}`);
                    if (!el) continue;
                    if (i === id) {
                        el.className = "p-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-center font-bold text-sm text-emerald-700 dark:text-emerald-300 shadow-md locker-active-pulse";
                        el.innerHTML = `<span>Tủ ${i}</span><div class="text-[10px] text-emerald-600 font-semibold uppercase">Đang mở</div>`;
                    } else {
                        el.className = "p-3 rounded-xl border border-outline-variant/40 bg-surface-container text-center font-medium text-sm text-on-surface-variant/70 opacity-60";
                        el.innerHTML = `<span>Tủ ${i}</span><div class="text-[10px]">Đóng</div>`;
                    }
                }
            }

            // 3. Xử lý khi người dùng ấn nút "ĐÃ BỎ HÀNG & ĐÓNG TỦ"
            btnClose.addEventListener("click", async () => {
                if (!currentLockerId) return;

                btnClose.disabled = true;
                btnClose.classList.add("opacity-60", "pointer-events-none");
                btnCloseText.textContent = "Đang Khóa Chốt Tủ...";

                try {
                    const response = await fetch("/api/orders/close-locker", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            lockerId: currentLockerId,
                            orderCode: currentOrderCode
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Cập nhật trạng thái icon thành đã khóa
                        lockerStatusIcon.textContent = "lock";
                        lockerIconWrap.className = "w-24 h-24 rounded-full bg-slate-100 border-2 border-slate-400 flex items-center justify-center text-slate-700";
                        lockerBadge.textContent = "Ô TỦ ĐÃ ĐÓNG VÀ KHÓA";
                        lockerSubDesc.innerHTML = `Ngăn tủ số <strong>${currentLockerId}</strong> đã được đóng và chốt an toàn.`;

                        // Hiện popup thông báo hoàn tất giao dịch
                        AppPopup.show({
                            title: "Hoàn Tất Giao Dịch",
                            icon: "check_circle",
                            content: `
                                <div class="space-y-3 text-on-surface-variant text-body-sm">
                                    <p>Kiện hàng của bạn đã được bỏ vào ô tủ số <strong>${currentLockerId}</strong> và đóng chốt an toàn.</p>
                                    <div class="p-3 bg-surface-container rounded-xl text-center space-y-1">
                                        <span class="text-xs text-on-surface-variant">Mã đơn hàng của bạn:</span>
                                        <div class="text-lg font-bold text-primary font-mono">${currentOrderCode}</div>
                                    </div>
                                    <p class="text-xs text-on-surface-variant/80">Người nhận sẽ nhận được tin nhắn tra cứu để đến lấy kiện hàng.</p>
                                </div>
                            `,
                            confirmText: "Về trang chủ",
                            onConfirm: () => {
                                window.location.href = "/";
                            }
                        });
                    } else {
                        throw new Error(data.message || "Lỗi đóng tủ");
                    }
                } catch (error) {
                    console.error("Lỗi đóng tủ:", error);
                    AppPopup.show({
                        title: "Lỗi Thao Tác",
                        icon: "error",
                        content: `
                            <p class="text-on-surface-variant">
                                ${error.message || "Không thể gửi lệnh đóng tủ. Vui lòng thử lại."}
                            </p>
                        `,
                        confirmText: "Đã hiểu"
                    });
                    btnClose.disabled = false;
                    btnClose.classList.remove("opacity-60", "pointer-events-none");
                    btnCloseText.textContent = "ĐÃ BỎ HÀNG & ĐÓNG TỦ";
                }
            });

            // Khởi tạo quy trình mở tủ
            initLockerDeposit();
        });
    </script>

</body>

</html>

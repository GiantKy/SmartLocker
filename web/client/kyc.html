<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="shell-type" content="mobile_tab">

    <title>Xác Thực e-KYC | EXPRESS</title>

    <!-- Google Fonts: Be Vietnam Pro -->
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"

    <style>
        /* Camera Viewport Area (Tỷ lệ chuẩn 4:3 đồng bộ với camera 640x480, phóng to khung oval) */
        .camera-viewport {
            position: relative;
            height: clamp(380px, 54vh, 480px);
            width: calc(clamp(380px, 54vh, 480px) * 4 / 3);
            aspect-ratio: 4 / 3;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Lật gương ngang đã được xử lý bằng H-Mirror phần cứng trên ESP32 */
            transition: opacity 0.3s;
            background: #000d2d;
            display: block;
        }

        canvas#renderCanvas {
            display: none;
        }

        /* Phủ màu nền #ffffff (trùng màu khung trắng bên ngoài), chỉ hiển thị đúng hình oval */
        .oval-vignette {
            position: absolute;
            inset: -1px;
            pointer-events: none;
            background: radial-gradient(
                ellipse 18.5% 38% at 50% 50.4%,
                transparent 97%,
                #ffffff 99.5%
            );
            transition: background 0.4s ease;
            z-index: 2;
        }

        .oval-vignette.stage-turn {
            background: radial-gradient(
                ellipse 23% 39.5% at 50% 50.4%,
                transparent 97%,
                #ffffff 99.5%
            );
        }

        /* The Central Oval Guide: 37% x 76% tương ứng 236px x 364px trên frame 640x480 */
        .face-oval {
            position: absolute;
            top: 50.4%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 37%;
            height: 76%;
            border-radius: 50% / 48%;
            border: 4px solid #000d2d;
            box-shadow: 0 0 25px rgba(0, 13, 45, 0.2);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        /* Oval State: Aligned & Good */
        .face-oval.state-aligned {
            border-color: #10b981 !important;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.6) !important;
            animation: pulseGlow 1.8s infinite alternate;
        }

        /* Oval State: Warning */
        .face-oval.state-warning {
            border-color: #f59e0b !important;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6) !important;
        }

        /* Oval State: Danger / Error */
        .face-oval.state-danger {
            border-color: #ef4444 !important;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.6) !important;
        }

        /* Oval State: Active Challenge (Orange Accent) */
        .face-oval.state-challenge {
            border-color: #fd6607 !important;
            box-shadow: 0 0 35px rgba(253, 102, 7, 0.65) !important;
        }

        /* Stage: Turn Head -> Widen oval (46% x 75% tương ứng 295px x 360px trên frame 640x480) */
        .face-oval.stage-turn {
            width: 46% !important;
            height: 75% !important;
            border-radius: 48% / 46% !important;
            border-color: #fd6607 !important;
            box-shadow: 0 0 40px rgba(253, 102, 7, 0.6) !important;
        }

        @keyframes pulseGlow {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.02); }
        }

        /* Scanning Radar Line */
        .scan-radar {
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 3.5px;
            background: linear-gradient(90deg, transparent, #fd6607, transparent);
            box-shadow: 0 0 14px #fd6607;
            animation: scanLaser 2.2s ease-in-out infinite alternate;
            border-radius: 99px;
        }

        .face-oval.state-aligned .scan-radar {
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            box-shadow: 0 0 16px #10b981;
        }

        @keyframes scanLaser {
            0% { top: 8%; opacity: 0.3; }
            50% { opacity: 1; }
            100% { top: 92%; opacity: 0.3; }
        }

        /* Big Countdown Badge */
        .countdown-overlay {
            position: absolute;
            top: 50.4%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #10b981;
            border: 4px solid #ffffff;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 3.25rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.65);
            z-index: 5;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Direction Arrow for Head Turn: Hình tròn bao quanh mũi tên, khung xám */
        .direction-hint-arrow {
            position: absolute;
            top: 50.4%;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(241, 245, 249, 0.95);
            border: 2px solid #cbd5e1;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16), 0 0 12px rgba(253, 102, 7, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.25s ease;
        }

        .direction-hint-arrow.left {
            left: calc(50% - 23%);
            transform: translate(-50%, -50%);
            animation: bounceArrowLeft 0.8s infinite alternate ease-in-out;
        }

        .direction-hint-arrow.right {
            left: calc(50% + 23%);
            transform: translate(-50%, -50%);
            animation: bounceArrowRight 0.8s infinite alternate ease-in-out;
        }

        @keyframes bounceArrowLeft {
            from { transform: translate(-50%, -50%) translateX(0); }
            to { transform: translate(-50%, -50%) translateX(-6px); }
        }

        @keyframes bounceArrowRight {
            from { transform: translate(-50%, -50%) translateX(0); }
            to { transform: translate(-50%, -50%) translateX(6px); }
        }

        /* Fullscreen Result Modal Overlay */
        .result-screen {
            position: absolute;
            inset: 0;
            max-width: 400px;
            margin: 0 auto;
            background: rgba(11, 28, 48, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            z-index: 50;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body class="bg-background font-body-md text-on-surface antialiased flex flex-col min-h-screen">

    <!-- ================= MAIN ================= -->
    <main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-background min-h-screen">

        <!-- Thanh trên cùng: Chỉ hiển thị nút Hủy giao dịch -->
        <div class="w-full max-w-md mx-auto px-margin pt-4 pb-2 flex items-center justify-start">
            <button
                type="button"
                id="btn-cancel-transaction"
                class="inline-flex items-center gap-1.5 px-3.5 py-2
                rounded-xl bg-error-container/70 hover:bg-error-container

            >
                <span class="material-symbols-outlined text-[18px]">close</span>

        </div>

        <!-- Khung chính căn giữa màn hình -->
        <div class="flex-1 flex flex-col justify-center items-center px-margin py-2 gap-3 max-w-[460px] mx-auto w-full">

            <!-- KHUNG TRẮNG: Bao cả phần oval và phần text hướng dẫn -->
            <div class="w-full bg-surface-container-lowest rounded-3xl p-3 sm:p-4 shadow-sm border border-outline-variant/40 flex flex-col items-center gap-2.5 overflow-hidden">

                <!-- Phần Khung Oval Camera KYC phóng to -->
                <div class="w-full relative flex items-center justify-center overflow-hidden rounded-2xl">
                    
                    <!-- Live Camera Viewport -->
                    <div class="camera-viewport">
                        <img id="cameraStream" src="/stream" alt="ESP32-CAM Live Stream" crossorigin="anonymous" onerror="handleStreamError()">
                        <canvas id="renderCanvas"></canvas>

                        <!-- Video Recording Indicator Badge (Đỏ REC nhấp nháy ở giữa trên) -->
                        <div id="recordingBadge" class="absolute top-3 left-1/2 -translate-x-1/2 z-10 hidden items-center gap-1.5 px-3 py-1 rounded-full bg-rose-600/90 text-white backdrop-blur-md shadow-md text-[11px] font-bold tracking-wider pointer-events-none transition-all">
                            <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                            <span id="recordingText">REC 00:00</span>
                        </div>

                        <!-- Stream Action Buttons -->
                        <div class="absolute top-3 right-3 z-10 flex items-center gap-1.5">
                            <button type="button" onclick="reloadStream()" title="Tải lại luồng camera" class="w-7 h-7 rounded-full bg-surface-container-lowest/90 backdrop-blur-md border border-outline-variant/50 shadow-sm flex items-center justify-center text-primary hover:bg-surface-container active:scale-95 transition">
                                <span class="material-symbols-outlined text-[16px]">refresh</span>

                        <!-- Vignette phủ nền trắng xung quanh, chỉ hiển thị vùng oval -->
                        <div class="oval-vignette" id="ovalVignette"></div>

                        <!-- The Central Face Guide Oval -->

                            <div class="scan-radar"></div>

                        <!-- Countdown Badge -->
                        <div class="countdown-overlay" id="countdownBadge">3</div>

                        <!-- Direction Arrow for Head Turn (Mũi tên bao quanh bởi hình tròn khung xám) -->

                        <!-- Fullscreen Result Screen -->

                            <!-- VÙNG HIỂN THỊ ẢNH AI ĐÃ CHECK (CROP FACE) -->

                            </div>

                                type="button"
                                class="inline-flex items-center gap-2 py-3 px-6 rounded-xl bg-gradient-to-r from-secondary-container to-secondary hover:opacity-95 text-white font-bold text-label-md shadow-lg active:scale-95 transition"

                                onclick="sendControlAction('restart')"

                    </div>

                </div>

                <!-- KHUNG XÁM: Bao phần text hướng dẫn bên dưới (chữ nhỏ gọn, tinh tế) -->
                <div class="w-full py-2 px-3 sm:py-2.5 sm:px-4 rounded-xl bg-surface-container/70 border border-outline-variant/40 space-y-0.5 text-center">
                    <div class="text-xs sm:text-sm font-semibold text-primary tracking-normal min-h-[18px] sm:min-h-[20px] flex items-center justify-center" id="hudPrompt">
                        Vui lòng đưa mặt vào giữa khung oval
                    </div>
                    
                    <div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden mt-1 hidden" id="progressTrack">
                        <div class="h-full bg-gradient-to-r from-secondary-container to-secondary rounded-full transition-all duration-150" id="progressBar" style="width: 0%;"></div>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // =========================================================================
        // PURE PRESENTATION & CONTROL VIEW (DUMB CLIENT)
        // Client chỉ đóng vai trò hiển thị kết quả AI check, hiển thị ảnh và gửi lệnh điều khiển.
        // Toàn bộ logic, state machine, kiểm tra khuôn mặt, chớp mắt, quay đầu do Server + AI xử lý.
        // =========================================================================

        const API_BASE_URL = window.location.origin;
        let kycWs = null;
        let redirectTimer = null;

        // Âm thanh phản hồi trực quan (Web Audio API)
        let audioCtx = null;
        function playChime(soundType) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (!soundType) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (soundType === 'beep') {
                    osc.frequency.setValueAtTime(650, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.12);
                } else if (soundType === 'ding' || soundType === 'good') {
                    osc.frequency.setValueAtTime(950, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.22);
                } else if (soundType === 'warn') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (soundType === 'success') {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                    setTimeout(() => {
                        const osc2 = audioCtx.createOscillator();
                        const gain2 = audioCtx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioCtx.destination);
                        osc2.frequency.setValueAtTime(1320, audioCtx.currentTime);
                        gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                        osc2.start();
                        osc2.stop(audioCtx.currentTime + 0.3);
                    }, 180);
                } else if (soundType === 'fail') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch (e) {}
        }

        // =========================================================================
        // HÀM HIỂN THỊ DUY NHẤT: NHẬN DỮ LIỆU TỪ SERVER VÀ VẼ LÊN GIAO DIỆN
        // =========================================================================
        function applyRender(ui) {
            if (!ui) return;

            // 1. Text thông điệp HUD (Chỉ cập nhật DOM khi nội dung thay đổi)
            if (ui.prompt !== undefined) {
                const promptEl = document.getElementById('hudPrompt');
                if (promptEl && promptEl.textContent !== ui.prompt) {
                    promptEl.textContent = ui.prompt;
                }
            }

            // 2. Định dạng khung Oval & Vignette (Chỉ thay đổi class khi có sự khác biệt)
            const oval = document.getElementById('faceOval');
            const vignette = document.getElementById('ovalVignette');
            if (oval) {
                let cls = 'face-oval';
                if (ui.ovalState) cls += ' ' + ui.ovalState;
                if (ui.stageTurn) cls += ' stage-turn';
                if (oval.className !== cls) oval.className = cls;
            }
            if (vignette) {
                const vCls = 'oval-vignette' + (ui.stageTurn ? ' stage-turn' : '');
                if (vignette.className !== vCls) vignette.className = vCls;
            }

            // 3. Số đếm ngược
            const countBadge = document.getElementById('countdownBadge');
            if (countBadge) {
                if (ui.countdown > 0) {
                    if (countBadge.style.display !== 'flex') countBadge.style.display = 'flex';
                    const cStr = String(ui.countdown);
                    if (countBadge.textContent !== cStr) countBadge.textContent = cStr;
                } else {
                    if (countBadge.style.display !== 'none') countBadge.style.display = 'none';
                }
            }

            // 4. Mũi tên định hướng
            const arrowLeft = document.getElementById('arrowLeft');
            const arrowRight = document.getElementById('arrowRight');
            if (arrowLeft) {
                const leftDisplay = (ui.arrow === 'left') ? 'flex' : 'none';
                if (arrowLeft.style.display !== leftDisplay) arrowLeft.style.display = leftDisplay;
            }
            if (arrowRight) {
                const rightDisplay = (ui.arrow === 'right') ? 'flex' : 'none';
                if (arrowRight.style.display !== rightDisplay) arrowRight.style.display = rightDisplay;
            }

            // 5. Thanh tiến trình
            const track = document.getElementById('progressTrack');
            const bar = document.getElementById('progressBar');
            if (track && bar) {
                if (ui.progress !== null && ui.progress !== undefined) {
                    if (track.style.display !== 'block') {
                        track.classList.remove('hidden');
                        track.style.display = 'block';
                    }
                    bar.style.width = Math.min(100, Math.max(0, ui.progress)) + '%';
                } else {
                    if (track.style.display !== 'none') track.style.display = 'none';
                }
            }

            // 6. Âm thanh phản hồi
            if (ui.sound) {
                playChime(ui.sound);
            }

            // 7. Đồng bộ hiển thị Huy hiệu REC (Ghi hình được thực hiện hoàn toàn ở Server)
            if (ui.recordAction === 'START' || (ui.countdown > 0 && ui.countdown <= 3)) {
                startRecBadge();
            }
            if (ui.recordAction === 'CANCEL') {
                stopRecBadge();
            }
            if (ui.recordAction === 'STOP') {
                stopRecBadge();
            }

            // 8. Màn hình kết quả
            const resScreen = document.getElementById('resultScreen');
            if (resScreen) {
                if (ui.result && ui.result.show) {
                    stopRecBadge();
                    if (resScreen.style.display !== 'flex') resScreen.style.display = 'flex';

                    const icon = document.getElementById('resultIcon');
                    const title = document.getElementById('resultTitle');
                    const desc = document.getElementById('resultDesc');
                    const btnRestart = document.getElementById('btnRestart');
                    const imgContainer = document.getElementById('resultImageContainer');
                    const btnView = document.getElementById('btnViewVideo');

                    if (ui.result.success) {
                        // KHI THÀNH CÔNG: CHỈ HIỆN XÁC THỰC THÀNH CÔNG VÀ KHÔNG HIỆN GÌ NỮA, CHUYỂN SANG TRANG LOCKER
                        if (icon) {
                            icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mb-4 shadow-xl border-2 bg-emerald-500/20 border-emerald-500 text-emerald-400';
                            icon.innerHTML = '<span class="material-symbols-outlined text-[48px]">check</span>';
                            icon.style.display = 'flex';
                        }
                        if (title) {
                            title.textContent = 'Xác Thực Thành Công';
                            title.style.display = 'block';
                        }

                        // Ẩn tất cả các thành phần khác khi thành công
                        if (desc) {
                            desc.textContent = '';
                            desc.style.display = 'none';
                        }
                        if (imgContainer) {
                            imgContainer.classList.add('hidden');
                            imgContainer.classList.remove('flex');
                            imgContainer.style.display = 'none';
                        }
                        if (btnRestart) {
                            btnRestart.style.display = 'none';
                        }

                        // Chuyển tiếp ngay sang trang locker
                        if (redirectTimer) clearTimeout(redirectTimer);
                        const targetUrl = ui.result.redirectUrl || '/locker';
                        redirectTimer = setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 1200);

                    } else {
                        // KHI THẤT BẠI: HIỆN THẤT BẠI VÀ CÓ NÚT LÀM LẠI
                        if (icon) {
                            icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mb-3 shadow-xl border-2 bg-rose-500/20 border-rose-500 text-rose-400';
                            icon.innerHTML = '<span class="material-symbols-outlined text-[48px]">close</span>';
                            icon.style.display = 'flex';
                        }
                        if (title) {
                            title.textContent = ui.result.title || 'Xác Thực Thất Bại';
                            title.style.display = 'block';
                        }
                        if (desc) {
                            desc.textContent = ui.result.desc || 'Không vượt qua kiểm tra sinh trắc học. Vui lòng bấm thử lại.';
                            desc.style.display = 'block';
                        }
                        if (imgContainer) {
                            imgContainer.classList.add('hidden');
                            imgContainer.classList.remove('flex');
                            imgContainer.style.display = 'none';
                        }
                        if (btnRestart) {
                            btnRestart.style.display = 'inline-flex';
                        }
                    }
                } else {
                    if (resScreen.style.display !== 'none') resScreen.style.display = 'none';
                }
            }
        }

        // =========================================================================
        // ĐIỀU KHIỂN (CONTROLS): GỬI THAO TÁC NGƯỜI DÙNG TỚI SERVER
        // =========================================================================
        function sendControlAction(action, data = {}) {
            if (kycWs && kycWs.readyState === WebSocket.OPEN) {
                kycWs.send(JSON.stringify({ action, ...data }));
            }
            if (action === 'restart') {
                if (redirectTimer) {
                    clearTimeout(redirectTimer);
                    redirectTimer = null;
                }
                stopRecBadge();
                const resScreen = document.getElementById('resultScreen');
                if (resScreen) resScreen.style.display = 'none';
                reloadStream();
            }
        }

        let streamRetryTimeout = null;
        function handleStreamError() {
            if (streamRetryTimeout) return;
            streamRetryTimeout = setTimeout(() => {
                streamRetryTimeout = null;
                reloadStream();
            }, 800);
        }

        function reloadStream() {
            const img = document.getElementById('cameraStream');
            if (img) img.src = `${API_BASE_URL}/stream?t=${Date.now()}`;
        }

        // =========================================================================
        // TRẠNG THÁI GHI HÌNH REC TRÊN GIAO DIỆN (SERVER ĐẢM NHIỆM 100% GHI HÌNH)
        // =========================================================================
        let isRecordingUi = false;
        let recTimerInterval = null;
        let recStartTime = 0;

        function startRecBadge() {
            if (isRecordingUi) return;
            isRecordingUi = true;
            recStartTime = Date.now();
            const badge = document.getElementById('recordingBadge');
            const badgeText = document.getElementById('recordingText');
            if (badge) {
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            }
            if (badgeText) badgeText.textContent = 'REC 00:00';

            if (recTimerInterval) clearInterval(recTimerInterval);
            recTimerInterval = setInterval(() => {
                if (!isRecordingUi) return;
                const elapsedSec = Math.floor((Date.now() - recStartTime) / 1000);
                const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
                const secs = String(elapsedSec % 60).padStart(2, '0');
                if (badgeText) badgeText.textContent = `REC ${mins}:${secs}`;
            }, 1000);
        }

        function stopRecBadge() {
            isRecordingUi = false;
            if (recTimerInterval) {
                clearInterval(recTimerInterval);
                recTimerInterval = null;
            }
            const badge = document.getElementById('recordingBadge');
            if (badge) {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        // =========================================================================
        // KẾT NỐI WEBSOCKET TỚI SERVER NODE.JS
        // =========================================================================
        function connectKycWs() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/api/kyc/ws`;

            kycWs = new WebSocket(wsUrl);

            kycWs.onopen = () => {
                reloadStream();
            };

            kycWs.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'STREAM_RELOAD' || msg.type === 'CAMERA_RECONNECTED' || msg.type === 'ESP32_RECONNECTED') {
                        reloadStream();
                    }
                    if (msg.type === 'AI_COUNTDOWN_START') {
                        startRecBadge();
                    } else if (msg.type === 'AI_COUNTDOWN_CANCEL' || msg.type === 'AI_RESTART' || msg.type === 'CAMERA_DISCONNECTED') {
                        stopRecBadge();
                    }
                    if (msg.render) {
                        applyRender(msg.render);
                    }
                } catch (e) {}
            };

            kycWs.onclose = () => {
                setTimeout(connectKycWs, 2000);
            };
        }

        // =========================================================================
        // KHỞI TẠO & SỰ KIỆN HỦY GIAO DỊCH
        // =========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const cancelBtn = document.getElementById('btn-cancel-transaction');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    if (window.AppPopup) {
                        window.AppPopup.show({
                            title: "Hủy giao dịch",
                            icon: "warning",
                            content: `
                                <p class="text-on-surface-variant">
                                    Bạn có chắc chắn muốn hủy giao dịch hiện tại và quay về trang chủ không?
                                </p>
                            `,
                            cancelText: "Tiếp tục",
                            confirmText: "Hủy giao dịch",
                            onConfirm: () => {
                                stopRecBadge();
                                sendControlAction('stop');
                                const form = document.createElement("form");
                                form.method = "POST";
                                form.action = "/api/transaction/cancel";
                                document.body.appendChild(form);
                                form.submit();
                            }
                        });
                    } else {
                        stopRecBadge();
                        sendControlAction('stop');
                        window.location.href = "/";
                    }
                });
            }

            connectKycWs();
        });

        window.addEventListener('beforeunload', () => {
            navigator.sendBeacon(`${API_BASE_URL}/api/camera/power?enable=0`);
        });
        window.addEventListener('pagehide', () => {
            navigator.sendBeacon(`${API_BASE_URL}/api/camera/power?enable=0`);
        });
    </script>
</body>
